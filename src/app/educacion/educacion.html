<section class="bg-surface px-gutter py-xl" id="educacion">
  <div class="max-w-300 mx-auto text-center md:text-left">
    @if (isLoading()) {
      <div class="grid md:grid-cols-3 gap-lg items-center">
        <div class="md:col-span-1 space-y-4">
          <div
            class="h-8 w-48 bg-surface-container rounded-base animate-pulse mx-auto md:mx-0"
          ></div>
          <div class="h-1 w-12 bg-surface-container rounded-full mx-auto md:mx-0"></div>
        </div>
        <div class="md:col-span-2">
          <div
            class="bg-surface-container p-8 rounded-lg border border-outline-variant shadow-sm animate-pulse h-40"
          ></div>
        </div>
      </div>
    } @else if (error()) {
      <div class="text-center">
        <p class="font-body-lg text-body-lg text-error mb-4">
          No se pudo cargar la información. Intenta de nuevo.
        </p>
        <button
          class="px-6 py-3 bg-primary text-on-primary rounded-base font-label-mono text-label-mono hover:shadow-lg transition-all"
          type="button"
          (click)="reload()"
        >
          Reintentar
        </button>
      </div>
    } @else {
      <div class="grid md:grid-cols-3 gap-lg items-center">
        <div class="md:col-span-1">
          <h2 class="font-headline-md text-headline-md text-on-background mb-4">
            {{ sectionTitle }}
          </h2>
          <div class="h-1 w-12 bg-primary rounded-full mb-8 mx-auto md:mx-0"></div>
        </div>

        <div class="md:col-span-2 space-y-6">
          @for (item of educacion(); track $index) {
            <div
              class="education-card bg-surface-container-lowest p-8 rounded-lg border border-outline-variant shadow-sm flex flex-col md:flex-row items-center md:items-start justify-between gap-4"
            >
              <div class="text-center md:text-left">
                <h3 class="font-headline-sm text-headline-sm text-on-background">
                  {{ item.titulo }}
                </h3>
                <p class="font-body-lg text-body-lg text-primary mt-2">
                  {{ item.institucion }}
                </p>
                <p class="font-body-md text-body-md text-on-surface-variant mt-2">
                  {{ item.descripcion }}
                </p>
              </div>
              <span
                class="inline-block px-4 py-2 bg-surface-container-high text-on-surface-variant font-label-mono text-label-mono rounded-full whitespace-nowrap"
              >
                {{ item.fechaInicio }} – {{ item.fechaFin }}
              </span>
            </div>
          }
        </div>
      </div>
    }
  </div>
</section>
